<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOH Women's Convention Admin Login</title>
<meta name="description" content="Secure login for the AOH Women's Convention admin portal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="admin-body">
  <main class="login-shell">
    <section class="login-card">
      <p class="admin-kicker">AOH Women's Convention Admin</p>
      <h1>Secure Login</h1>
      <p class="login-copy">Sign in to update dates, schedules, hotel details, media, and public website content.</p>

      <form id="loginForm" class="admin-form">
        <label>
          <span>Username</span>
          <input type="text" name="username" required autocomplete="username">
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <div id="turnstileContainer" class="turnstile-wrap"></div>
        <button type="submit" class="admin-primary">Sign In</button>
        <p id="loginStatus" class="admin-status" aria-live="polite"></p>
      </form>

      <p class="login-note">Use Cloudflare secrets for credentials and never expose API keys in browser code.</p>
    </section>
  </main>

  <script src="/assets/js/login.js" defer></script>
</body>
</html>
